# Release on a version tag (v0.1.0): build the CLI + keeper for each platform, bundle the shims,
# publish a GitHub release with checksums, then npm (launcher + per-platform binaries), PyPI and
# RubyGems. Set the version first with packaging/set-version.sh; the tag must match it.
# Tags with a pre-release suffix (v0.2.0-rc.1) publish to npm under the `next` dist-tag.
# Each publish step skips a version that is already on the registry, so a failed run can be re-run.
#
# Hand-written instead of cargo-dist because each archive must also carry the Node and Python
# shims (share/doppelkey/...), which the CLI references when it writes auto-load lines.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance and PyPI trusted publishing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the package versions
        run: sh packaging/check-version.sh "${GITHUB_REF_NAME#v}"

  build:
    needs: check
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      # Secrets can't be tested in `if:` directly, and a step's own env isn't visible to its `if:`.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERT_P12 != '' }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the Node shim
        working-directory: shims/node
        run: npm ci && npm run build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build the Java agent
        run: sh shims/java/build.sh
      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ contains(matrix.target, 'apple') && '--features macos-keychain' || '' }}
      - name: Sign and notarize (macOS, when signing secrets are configured)
        if: contains(matrix.target, 'apple') && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: packaging/macos-sign.sh target/${{ matrix.target }}/release
      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="doppelkey-${VERSION}-${{ matrix.target }}"
          mkdir -p "$NAME/bin" "$NAME/share/doppelkey/node" "$NAME/share/doppelkey/python"
          cp target/${{ matrix.target }}/release/doppelkey target/${{ matrix.target }}/release/doppelkeyd "$NAME/bin/"
          cp shims/node/dist/register.cjs shims/node/dist/register.mjs "$NAME/share/doppelkey/node/"
          cp -R shims/python/src/doppelkey shims/python/src/sitecustomize.py "$NAME/share/doppelkey/python/"
          mkdir -p "$NAME/share/doppelkey/ruby" && cp -R shims/ruby/lib/. "$NAME/share/doppelkey/ruby/"
          mkdir -p "$NAME/share/doppelkey/java" && cp shims/java/dist/doppelkey-agent.jar "$NAME/share/doppelkey/java/"
          cp LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.npm }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS install.sh --title "$GITHUB_REF_NAME" --generate-notes

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: npm install -g npm@11
      - name: Publish per-platform binary packages, then the launcher + shim
        env:
          # Optional: with trusted publishing configured on npmjs.com, npm authenticates with
          # GitHub's OIDC token and this secret isn't needed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *-*) TAG=next ;; *) TAG=latest ;; esac
          publish() { # publish <dir> <name>, skipping a version that is already on the registry
            if npm view "$2@$VERSION" version >/dev/null 2>&1; then echo "$2@$VERSION already published"; return; fi
            (cd "$1" && npm publish --provenance --access public --tag "$TAG")
          }
          node packaging/npm/make-platform-packages.mjs "$VERSION" dist out
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do publish "out/cli-$p" "@doppelkey/cli-$p"; done
          cd shims/node && npm ci && npm run build
          # The per-platform binaries are added as optional dependencies only at publish time
          # (they don't exist on the registry before the first release, which would break npm ci).
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do npm pkg set "optionalDependencies.@doppelkey/cli-$p=$VERSION"; done
          publish . doppelkey

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build && python -m build shims/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  rubygems:
    needs: build
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Build and push the gem
        working-directory: shims/ruby
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gem list --remote --exact --all doppelkey | grep -q "[( ]$VERSION[,)]"; then echo "doppelkey $VERSION already on RubyGems"; exit 0; fi
          gem build doppelkey.gemspec
          gem push doppelkey-*.gem
