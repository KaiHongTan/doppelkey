version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /shims/node
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /compat/node
    schedule: { interval: weekly }
    groups:
      compat-libraries: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /compat/python
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
