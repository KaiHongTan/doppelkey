[workspace]
resolver = "2"
members = ["crates/proto", "crates/doppelkeyd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/KaiHongTan/dopplekey"
rust-version = "1.80"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
