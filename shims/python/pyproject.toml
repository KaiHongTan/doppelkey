[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "doppelkey"
version = "0.1.0"
description = "An ssh-agent for app secrets: keep signing and encryption keys out of your Python process (shim)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/KaiHongTan/doppelkey"

[tool.hatch.build.targets.wheel]
packages = ["src/doppelkey"]

# Installing the wheel drops doppelkey.pth into site-packages, so every Python process in the
# environment loads the shim (it does nothing unless a handle is used).
[tool.hatch.build.targets.wheel.force-include]
"doppelkey.pth" = "doppelkey.pth"
